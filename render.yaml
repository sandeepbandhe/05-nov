services:
  - type: web
    name: workshop-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false